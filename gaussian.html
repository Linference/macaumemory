<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0c1318"><meta name="description" content="途見澳門記憶：即時瀏覽三維高斯實景，旋轉、縮放與本地開啟模型。"><title>實景記憶 · 途見</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230c1318'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='%23d8b45a' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23d8b45a'/%3E%3C/svg%3E"></head>
<body><main class="gs-shell"><canvas id="gs-canvas" tabindex="0" aria-label="可旋轉縮放的三維高斯實景，方向鍵旋轉，加減鍵縮放"></canvas>
<header class="gs-header"><a class="gs-brand" href="./">途見 <span>實景記憶</span></a><a id="gs-map-link" href="./?spot=ruins-st-paul">返回地圖</a></header>
<section class="gs-intro"><p>MACAU MEMORY / LIVE 3D</p><h1 id="gs-title">大三巴牌坊</h1><span id="gs-description">從多視角影像重建，走進建築與街巷的空間。</span></section>

<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MacauSplat · 目标框</title><style>body{margin:0;background:#f4f2ec;color:#244d46;font:16px system-ui}main{max-width:1100px;margin:auto;padding:24px}p{line-height:1.8}button{padding:12px 18px;background:#244d46;color:white;border:0;border-radius:8px;margin:4px;cursor:pointer}button:disabled{opacity:.4}canvas{max-width:100%;max-height:65vh;touch-action:none;background:#ddd}#stage{display:grid;place-items:center;background:#deddd6;padding:12px}</style><main><h1>在不同视角上框出同一个目标</h1><p>选择至少两个不同视角，拖曳框选目标建筑的可见范围。背景、地面与相邻建筑尽量留在框外。建议框选 3–5 张；种子框用于约束重建目标，不是独立评测真值。</p><p id="status"></p><button id="prev">上一张</button><button id="next">下一张</button><button id="clear">清除当前框</button><button id="save">导出目标框</button><div id="stage"><canvas id="canvas"></canvas></div><p id="error" role="alert"></p><p>导出后，在 MacauSplat 点击“用目标框生成标注”选择该文件。支持点不足时会停止，并提示增加视角。</p></main><script type="application/json" id="frames">__SEED_FRAMES__</script><script>
const source=JSON.parse(document.querySelector('#frames').textContent),frames=source.frames,labels=new Map(),canvas=document.querySelector('#canvas'),ctx=canvas.getContext('2d');let i=0,image=null,start=null,draft=null,loaded=false,version=0;
function draw(){if(!loaded)return;ctx.drawImage(image,0,0);const b=draft||labels.get(frames[i].frame);if(b){ctx.strokeStyle='#00ce91';ctx.lineWidth=Math.max(2,canvas.width/250);ctx.strokeRect((b[0]-b[2]/2)*canvas.width,(b[1]-b[3]/2)*canvas.height,b[2]*canvas.width,b[3]*canvas.height)}}
function status(){document.querySelector('#status').textContent=`${i+1}/${frames.length} · ${frames[i].frame} · 已框选 ${labels.size} 张`;document.querySelector('#save').disabled=labels.size<2;document.querySelector('#prev').disabled=i===0;document.querySelector('#next').disabled=i===frames.length-1;}
function load(){loaded=false;start=null;draft=null;status();const token=++version,next=new Image();document.querySelector('#error').textContent='';next.onload=()=>{if(token!==version)return;image=next;canvas.width=image.naturalWidth;canvas.height=image.naturalHeight;loaded=true;draw();};next.onerror=()=>{if(token===version)document.querySelector('#error').textContent='照片读取失败，请确认工程影格仍在原目录。';};next.src=frames[i].src;}
function point(e){const r=canvas.getBoundingClientRect();return[Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),Math.max(0,Math.min(1,(e.clientY-r.top)/r.height))];}
function move(e){const p=point(e);draft=[(start[0]+p[0])/2,(start[1]+p[1])/2,Math.abs(start[0]-p[0]),Math.abs(start[1]-p[1])];draw();}
canvas.onpointerdown=e=>{if(loaded){start=point(e);canvas.setPointerCapture(e.pointerId);}};canvas.onpointermove=e=>{if(start)move(e);};canvas.onpointerup=e=>{if(!start)return;move(e);start=null;if(draft[2]>.002&&draft[3]>.002)labels.set(frames[i].frame,draft);draft=null;status();draw();};canvas.onpointercancel=()=>{start=null;draft=null;draw();};
document.querySelector('#prev').onclick=()=>{if(i>0){i--;load();}};document.querySelector('#next').onclick=()=>{if(i<frames.length-1){i++;load();}};document.querySelector('#clear').onclick=()=>{labels.delete(frames[i].frame);draft=null;status();draw();};document.querySelector('#save').onclick=()=>{if(labels.size<2)return;const data={schemaVersion:1,purpose:'target-seeds',sourceFingerprint:source.sourceFingerprint,labels:[...labels].map(([frame,bbox])=>({frame,bbox}))};const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='target-seeds.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};if(frames.length)load();else document.querySelector('#error').textContent='没有可用于目标框选的影格。';
</script></html>

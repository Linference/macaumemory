<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>人工標註對照 · MacauSplat</title>
<style>body{background:#f5f2eb;color:#244d46;font:15px system-ui;margin:0}main{max-width:1100px;margin:auto;padding:25px}p{line-height:1.7}button{background:#244d46;color:white;border:0;padding:12px 16px;border-radius:8px;margin:5px;cursor:pointer}button:disabled{opacity:.3}canvas{max-width:100%;max-height:65vh;touch-action:none;cursor:crosshair}#stage{background:#ddd;padding:12px;display:grid;place-items:center}small{display:block;line-height:1.7;margin:15px 0}</style>
<main><h1>在實拍影格上框選目標</h1><p>拖曳框選物件的可見範圍，或選擇「無目標」。人工基準預設隱藏自動框；查看自動框後，整份結果會標記為輔助複核。</p><p id="status"></p><button id="prev">上一張</button><button id="next">下一張</button><button id="absent">無目標</button><button id="auto">查看自動框</button><button id="save">匯出人工標註</button><div id="stage"><canvas id="canvas"></canvas></div><small>計時只記錄本頁框選操作，不含拍攝、重建與啟動。無人工基準時不計算準確率。未校準尺度的三維尺寸不是實際公尺。</small>
<script type="application/json" id="bundle">__BUNDLE_JSON__</script><script>
const data=JSON.parse(document.querySelector('#bundle').textContent),samples=data.samples,canvas=document.querySelector('#canvas'),ctx=canvas.getContext('2d'),image=new Image(),labels=new Map();
let i=0,start=null,box=null,timer=0,loaded=false,show=false,assisted=false;
function draw(){if(!loaded)return;ctx.drawImage(image,0,0);const b=box||(show?samples[i].yolo:null);if(b){const[x,y,w,h]=b;ctx.strokeStyle=box?'#00d19b':'#f1b634';ctx.lineWidth=Math.max(2,canvas.width/220);ctx.strokeRect((x-w/2)*canvas.width,(y-h/2)*canvas.height,w*canvas.width,h*canvas.height)}}
function status(){document.querySelector('#status').textContent=`${data.report.sceneKind} · ${i+1}/${samples.length} · 已標註 ${labels.size} 張 · ${samples[i].frame}${assisted?' · assisted-review':''}`}
function load(){loaded=false;box=labels.get(samples[i].frame)?.bbox??null;show=false;status();document.querySelector('#prev').disabled=i===0;document.querySelector('#next').disabled=i===samples.length-1;image.onload=()=>{canvas.width=image.naturalWidth;canvas.height=image.naturalHeight;loaded=true;timer=performance.now();draw()};image.src=samples[i].image}
function point(e){const r=canvas.getBoundingClientRect();return[Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),Math.max(0,Math.min(1,(e.clientY-r.top)/r.height))]}
function record(bbox){const old=labels.get(samples[i].frame);labels.set(samples[i].frame,{frame:samples[i].frame,bbox,seconds:(old?.seconds||0)+(performance.now()-timer)/1000});timer=performance.now();status()}
canvas.onpointerdown=e=>{if(loaded){start=point(e);canvas.setPointerCapture(e.pointerId)}};
function drag(e){const p=point(e);box=[(start[0]+p[0])/2,(start[1]+p[1])/2,Math.abs(start[0]-p[0]),Math.abs(start[1]-p[1])];draw()}
canvas.onpointermove=e=>{if(start)drag(e)};canvas.onpointerup=e=>{if(!start)return;drag(e);start=null;if(box[2]>.002&&box[3]>.002)record(box);else box=labels.get(samples[i].frame)?.bbox??null;draw()};canvas.onpointercancel=()=>{start=null};
document.querySelector('#prev').onclick=()=>{i--;load()};document.querySelector('#next').onclick=()=>{i++;load()};document.querySelector('#absent').onclick=()=>{if(!loaded)return;box=null;record(null);draw()};document.querySelector('#auto').onclick=()=>{assisted=true;show=!show;draw();status()};
document.querySelector('#save').onclick=()=>{if(!labels.size){alert('請先完成一張標註');return}const result={schemaVersion:1,sessionId:data.report.sessionId,annotationSha256:data.report.annotationSha256,mode:assisted?'assisted-review':'manual',labels:[...labels.values()]};const url=URL.createObjectURL(new Blob([JSON.stringify(result,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='manual-review.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};if(samples.length)load();
</script></main></html>
